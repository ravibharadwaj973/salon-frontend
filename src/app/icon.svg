<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Parlon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Parlon</title>

  <!--
    Inverted from the original: the rounded square carries the orange, the mark
    is knocked out in white. Drawn as real geometry rather than traced, so it
    stays crisp at 16px in a browser tab and at a metre on a wall.
  -->

  <!-- The tile. Radius is 22.5% of the side, which is the iOS/macOS icon
       proportion — a smaller radius reads as a plain square at small sizes. -->
  <rect width="512" height="512" rx="115" fill="#EA580C"/>

  <!-- The blade: one stroke, round caps, so the ends stay true at any scale. -->
  <path d="M 102 102 L 378 421"
        stroke="#FFFFFF" stroke-width="50" stroke-linecap="round" fill="none"/>

  <!-- The leaf: a two-arc lens, pointed at the top right, meeting the blade. -->
  <path d="M 433 94
           C 425.0 190.2, 373.7 247.9, 279 267
           C 293.0 176.1, 344.3 118.4, 433 94 Z"
        fill="#FFFFFF"/>

  <!-- The handle ring, drawn as a stroked circle so the hole is a true hole. -->
  <circle cx="163" cy="336" r="50"
          stroke="#FFFFFF" stroke-width="34" fill="none"/>
</svg>
